<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- NOVA PLUS · símbolo: estrella nova de cuatro puntas que forma un "+" dentro de una órbita -->
  <defs>
    <linearGradient id="onyx" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18202B"/>
      <stop offset="1" stop-color="#0A0E14"/>
    </linearGradient>
    <linearGradient id="gold" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#F3E3B5"/>
      <stop offset="0.45" stop-color="#D6B266"/>
      <stop offset="1" stop-color="#A97F33"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#D6B266" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#D6B266" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="0" fill="url(#onyx)"/>
  
  <circle cx="256" cy="256" r="150" fill="url(#glow)"/>
  <!-- órbita con un espacio arriba a la derecha -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#gold)" stroke-width="10" stroke-dasharray="842 100" transform="rotate(-27 256 256)"/>
  <circle cx="362" cy="150" r="13" fill="url(#gold)"/>
  <!-- estrella nova / "+" -->
  <path d="M256 128 C 267 226 286 245 384 256 C 286 267 267 286 256 384 C 245 286 226 267 128 256 C 226 245 245 226 256 128 Z" fill="url(#gold)"/>
</svg>
