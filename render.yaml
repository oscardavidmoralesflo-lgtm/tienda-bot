services:
  - type: web
    name: tienda-bot
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: BOT_TOKEN
        sync: false
      - key: KOKORO_API_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SHOP_PREFIX
        sync: false
      - key: DB_SCHEMA
        value: tienda
      - key: SESSION_SECRET
        generateValue: true
